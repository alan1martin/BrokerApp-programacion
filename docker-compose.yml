services:
  # ================= SERVICIO DEL BACKEND (DJANGO CON SQLITE) =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app4-backend
    restart: always
    environment:
      - VIRTUAL_HOST=api.app4.academia.ar
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=api.app4.academia.ar
      - LETSENCRYPT_EMAIL=admin@academia.ar
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-api.app4.academia.ar,localhost,127.0.0.1}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-${SECRET_KEY}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${DJANGO_SECRET_KEY:-${SECRET_KEY}}}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-UnPasswordSeguroParaAdmin123}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@academia.ar}
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: 384m

  # ================= SERVICIO DEL FRONTEND (REACT + VITE + NGINX) =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app4-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - VIRTUAL_HOST=app4.academia.ar
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=app4.academia.ar
      - LETSENCRYPT_EMAIL=admin@academia.ar
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: 128m

# Red Externa Obligatoria conectada al Nginx Proxy del servidor
networks:
  nginx-proxy:
    external: true
